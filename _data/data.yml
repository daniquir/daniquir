experiences:
  title: Experiencia
  info:
  - role: Analista programador senior
    time: 2024 - actualidad
    company: Qindel — Inditex · core retail
    details: |
      Liderazgo técnico en la migración del sistema core de negocio desde legacy hacia **Java 21**, **arquitectura hexagonal** y **microservicios** (Spring Boot, Spring Cloud).

      Diseño orientado a alta disponibilidad y picos de tráfico en retail; soporte y seguimiento de incidencias en producción.

      Roadmap de migración incremental sin interrupción del servicio; contratos de API, **Testcontainers** y **TDD** como estándar del equipo.
  - role: Analista programador senior
    time: 2020 - 2024
    company: Vitro · I+D sector salud
    details: |
      Arquitectura y desarrollo **greenfield** de plataforma **Java/Spring Boot** para sector salud, de diseño a producción.

      Solución modular desplegable **offline** en centros sin conectividad; datos sensibles con requisitos estrictos de seguridad y cumplimiento normativo.

      Desarrollo de **generadores de código** y **librerías internas** para alinear artefactos y acelerar al equipo de I+D.
  - role: Analista programador senior
    time: 2018 - 2020
    company: Metaenlace — Tempe / Inditex · migración legacy
    details: |
      Migración de monolitos legacy a arquitectura moderna; definición de arquitectura junto al Tech Lead en entorno Inditex.

      **TDD** en todos los desarrollos; creación de generadores de código y artefactos compartidos para homogeneizar equipos.

      Stack: **Java**, **.NET** y automatización **RPA (Blue Prism)** en procesos de negocio.
  - role: Analista programador
    time: 2015 - 2018
    company: Everis — ICO & SEPE · financiero y público
    details: |
      **ICO (financiero):** Java 6/8 y JSP en entorno bancario de alta transaccionalidad; generadores de código, entorno de desarrollo centralizado y formación de nuevas incorporaciones.

      **SEPE (público):** aplicación **Java 8/JSF** fullstack; motor de reporting con **JasperReports** para generación masiva de documentos.

projects:
  title: Proyectos open source
  intro: Selección de proyectos personales donde aplico arquitectura, seguridad e infraestructura más allá del stack diario en Java.
  assignments:
  - title: TALOS
    link: https://github.com/daniquir/talos
    tagline: Gestor de secretos self-hosted en Rust. Arquitectura de 3 capas aisladas (Web → Storage → Bunker), cifrado GPG RSA-4096, mTLS, rate limiting, auditoría, backup/restore y despliegue Docker.
  - title: Memory Vault
    link: https://github.com/daniquir/memory-vault
    tagline: Backup híbrido para Linux en Python. Combina Rclone (sync) y Restic (snapshots cifrados AES-256) sobre Wasabi S3; multi-dispositivo, retención configurable, RM-Shield y CLI + GUI.

