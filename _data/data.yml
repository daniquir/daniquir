career-profile:
  title: Sobre mí
  summary: |
    Backend senior en **Java/Spring** con más de once años en producción en retail (Inditex), financiero, salud y administración pública. Me ocupo sobre todo de **arquitectura y migraciones**: sacar sistemas legacy, diseñar microservicios que aguanten picos de carga y mantener el servicio mientras cambias piezas debajo.

    En **Qindel** (cliente Inditex) participo en la modernización del core de negocio: arquitectura hexagonal, Java 25 y microservicios, sustituyendo procesos batch de horas por datos operativos casi en tiempo real. En **Vitro** formé parte del equipo de I+D que levantó una plataforma sanitaria desde cero; yo llevé el módulo analítico y de datos **multicentro**, con sincronización casi en tiempo real entre sedes hospitalarias.

    En el día a día apoyo al equipo con **tests automatizados**, generadores de código y librerías compartidas. Combino backend con **Angular** y TypeScript cuando el proyecto lo pide. Fuera del trabajo mantengo proyectos personales en **Rust** y **Python** (ver sección de proyectos). Formación previa en mecánica industrial.

