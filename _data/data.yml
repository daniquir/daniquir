experiences:
  title: Experiencia
  info:
  - role: Senior Backend Engineer
    time: 2024 - actualidad
    company: Qindel — Inditex · core retail
    details: |
      Migración del core de negocio desde legacy hacia **Java 25**, **arquitectura hexagonal** y **microservicios** (Spring Boot, Spring Cloud). Referencia técnica en diseño y evolución del nuevo sistema.

      En curso: sustituir procesos batch que hoy tardan **horas** por **datos operativos casi en tiempo real** en el entorno retail.

      Roadmap incremental sin cortar servicio. Diseño de APIs con **OpenAPI**, contratos entre servicios, **Testcontainers** y **TDD** como práctica habitual del equipo.
  - role: Senior Backend Engineer
    time: 2020 - 2024
    company: Vitro · I+D sector salud
    details: |
      Desarrollo en equipo de una plataforma **Java/Spring Boot** para sector salud, desde el diseño inicial hasta producción.

      Responsable del módulo **analítico y de datos**: recolección **multicentro** en hospitales con varias sedes y procesamiento de actualizaciones **casi en tiempo real** para análisis científico y estadístico.

      Módulos desplegables **offline** en centros sin conectividad; datos sensibles con cumplimiento normativo.

      Formaciones internas semanales rotativas en el equipo de I+D. Generadores de código y librerías internas para reducir trabajo repetitivo.
  - role: Senior Backend Engineer
    time: 2018 - 2020
    company: Metaenlace — Tempe / Inditex · migración legacy
    details: |
      Tras cambios regulatorios, **proyecto end-to-end en solitario**: servicios de **más de 20 minutos** de respuesta reducidos a **menos de 3 segundos** con cachés, rediseño de procesos y optimización de rendimiento.

      Migración de monolitos legacy a arquitectura moderna en entorno Inditex; definición de arquitectura junto al Tech Lead.

      **TDD** en todos los desarrollos; generadores de código y artefactos compartidos entre equipos. Stack: **Java**, **.NET** y **RPA (Blue Prism)**.
  - role: Backend Engineer
    time: 2015 - 2018
    company: Everis — ICO & SEPE · financiero y público
    details: |
      **ICO (financiero):** liderazgo de un equipo de **3 personas** en la migración desde cero del módulo de **seguridad de la plataforma**: **Angular** en frontend y **Spring Security** en backend, conviviendo con el legacy mientras se migraban monolitos y microservicios sin interrumpir el servicio.

      **SEPE (público):** desarrollo fullstack **Java 8/JSF**; motor de reporting con **JasperReports** para generación masiva de documentos.

projects:
  title: Proyectos personales
  intro: Proyectos en Rust, Python y TypeScript — seguridad, backups, infraestructura y herramientas de desarrollo fuera del stack Java del día a día.
  assignments:
  - title: Cortex
    link: https://daniquir.github.io/cortex/es/
    tagline: Extensión VS Code con flujo agentic (Plan → Build) sobre OpenCode. Contexto léxico+semántico, Policy Brain y diffs inline.
  - title: TALOS
    link: https://github.com/daniquir/talos
    tagline: Gestor de secretos self-hosted en Rust. Arquitectura de 3 capas aisladas (Web → Storage → Bunker), cifrado GPG RSA-4096, mTLS, rate limiting, auditoría, backup/restore y despliegue Docker.
  - title: Memory Vault
    link: https://github.com/daniquir/memory-vault
    tagline: Backup híbrido para Linux en Python. Combina Rclone (sync) y Restic (snapshots cifrados AES-256) sobre Wasabi S3; multi-dispositivo, retención configurable, RM-Shield y CLI + GUI.

