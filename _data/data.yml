career-profile:
  title: Sobre mí
  summary: |
    Ingeniero de software senior con más de 9 años de experiencia construyendo backends en Java/Spring para entornos de alta exigencia: retail, salud y administración pública.

    Actualmente en Qindel (cliente Inditex), donde participo en la modernización del sistema core de negocio: migración desde legacy, arquitectura hexagonal, Java 21 y microservicios diseñados para picos de demanda. En Vitro diseñé desde cero una plataforma sanitaria modular, desplegable offline y orientada a la protección de datos sensibles.

    Perfil backend con solvencia fullstack (TypeScript, Angular) y base en infraestructura. Priorizo testing automatizado, generadores de código y librerías compartidas para escalar equipos sin perder calidad. En proyectos personales profundizo en Rust y Python (ver sección de proyectos).

